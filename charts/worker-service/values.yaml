image:
  repository: quay.io/my-org/worker-service
  tag: "latest"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
config:
  appEnv: "default"
  logLevel: "info"
  queueUrl: "redis://localhost:6379"
  concurrency: "5"
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 80
